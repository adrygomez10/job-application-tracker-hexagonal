name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  code-style:
    name: Code style
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check Java style with Spotless and Checkstyle
        run: docker compose -f compose.style.yaml run --rm --no-deps check
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Enforce static code quality
        run: bash scripts/quality.sh
      - name: Run all checks in Docker
        run: bash scripts/test.sh
      - name: Upload reports and fictional screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
            target/screenshots
            target/checkstyle-result.xml
            target/pmd.xml
            target/cpd.xml
