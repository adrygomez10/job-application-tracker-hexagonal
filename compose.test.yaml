name: job-application-tracker-tests
services:
  test-db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: tracker_test
      POSTGRES_USER: tracker
      POSTGRES_PASSWORD: test-only-password
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U tracker -d tracker_test']
      interval: 2s
      timeout: 5s
      retries: 30
  tests:
    build:
      context: .
      target: tests
    environment:
      DB_URL: jdbc:postgresql://test-db:5432/tracker_test
      DB_USERNAME: tracker
      DB_PASSWORD: test-only-password
    depends_on:
      test-db:
        condition: service_healthy
    volumes:
      - ./target:/workspace/target
