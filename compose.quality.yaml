name: job-application-tracker-quality
services:
  quality:
    build:
      context: .
      target: quality
    volumes:
      - ./target:/workspace/target
  format:
    build:
      context: .
      target: quality
    entrypoint: [mvn, -B, -ntp, 'spotless:apply']
    volumes:
      - .:/workspace
  maven:
    extends:
      service: quality
    entrypoint: [mvn, -B, -ntp]
