spring:
  application:
    name: job-application-tracker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/tracker}
    username: ${DB_USERNAME:tracker}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    cache: true
  mvc:
    problemdetails:
      enabled: false
  messages:
    basename: messages
server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
tracker:
  zone: ${TRACKER_ZONE:Europe/Madrid}
  username: ${TRACKER_USERNAME}
  password-hash: ${TRACKER_PASSWORD_HASH}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  structured:
    format:
      console: logstash
